<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnostic — Marketplace Helper</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    .diag-section { margin-bottom: 32px; }
    .diag-section > h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase;
      letter-spacing: .6px; margin: 0 0 12px; }
    .log-entry { background: white; border: 1px solid var(--line); border-radius: 10px;
      padding: 16px; margin-bottom: 10px; }
    .log-entry-header { display: flex; justify-content: space-between; align-items: baseline;
      gap: 12px; margin-bottom: 6px; }
    .log-entry-name { font-size: 13px; font-weight: 600; color: var(--ink); }
    .log-entry-time { font-size: 12px; color: var(--muted); white-space: nowrap; }
    pre.log-code { background: var(--bg); border-radius: 8px; padding: 12px; margin: 8px 0 0;
      font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
      max-height: 260px; overflow-y: auto; }
    .copy-bar { background: white; border-bottom: 1px solid var(--line); padding: 12px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .copy-bar p { margin: 0; font-size: 13px; color: var(--muted); }
    .meta-pills { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px;
      color: var(--muted); margin-bottom: 28px; }
    .meta-pills span strong { color: var(--ink); }
    .state-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .state-table th { text-align: left; padding: 6px 10px; color: var(--muted);
      font-weight: 500; border-bottom: 2px solid var(--line); }
    .state-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .state-table tr:last-child td { border-bottom: 0; }
    .state-table td:first-child { word-break: break-all; max-width: 240px; }
    .chip { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px;
      font-weight: 600; background: var(--soft); color: var(--teal); vertical-align: middle; }
    .chip.error-chip { background: #fdebea; color: #a12f27; }
    .chip.warn-chip { background: var(--warn-bg); color: var(--warn); }
    .err-msg { font-size: 13px; color: #a12f27; margin: 4px 0 6px; }
    .empty-notice { color: var(--muted); font-size: 13px; padding: 10px 0; }
    #loading { text-align: center; padding: 80px; color: var(--muted); font-size: 15px; }
    .log-filters { background: white; border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 14px; margin-bottom: 12px; }
    .log-filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    .log-filter-row label { font-size: 12px; color: var(--muted); }
    .log-filter-row input[type="text"], .log-filter-row select {
      font-size: 13px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; }
    .log-filter-row select { min-width: 160px; }
    .log-filter-types { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px;
      padding-top: 10px; border-top: 1px solid var(--line); }
    .log-type-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
      color: var(--ink); cursor: pointer; user-select: none; }
    .log-type-chip input { margin: 0; }
  </style>
</head>
<body data-page="logs">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="welcome.html">
        <img src="icons/icon128.png" alt="">
        <span>Marketplace Helper<small>para Vinted</small></span>
      </a>
      <span style="font-size:13px;color:var(--muted)">🔧 Diagnostic</span>
    </div>
  </header>
  <nav class="nav">
    <a href="options.html">Réglages</a>
  </nav>

  <div class="copy-bar">
    <p>Page de diagnostic — copiez les données JSON pour les envoyer au développeur.</p>
    <button id="copy-btn" class="primary" style="min-width:190px">📋 Copier tout (JSON)</button>
  </div>

  <div class="container">
    <div id="loading">Chargement des données de diagnostic…</div>
    <div id="main" hidden>

      <div class="meta-pills" id="meta-pills"></div>

      <!-- Coordinator state -->
      <div class="diag-section">
        <h2>État du coordinateur</h2>
        <div class="card" id="coordinator-card">
          <p class="empty-notice">Chargement…</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="diag-section">
        <h2>Actions enregistrées (<span id="actions-count">0</span>)</h2>
        <div class="log-filters">
          <div class="log-filter-row">
            <label for="filter-window">Période</label>
            <select id="filter-window">
              <option value="">Tout</option>
              <option value="5">5 min</option>
              <option value="15">15 min</option>
              <option value="30">30 min</option>
              <option value="60">1 h</option>
              <option value="180">3 h</option>
              <option value="1440">24 h</option>
            </select>
            <label for="filter-item-id">Article (item_id)</label>
            <select id="filter-item-id">
              <option value="">Tous les articles</option>
            </select>
            <button id="filter-reset" class="button" type="button">Réinitialiser</button>
          </div>
          <div class="log-filter-types" id="filter-types"></div>
        </div>
        <div id="actions-list"></div>
      </div>

      <!-- Jobs -->
      <div class="diag-section">
        <h2>Jobs en attente (<span id="jobs-count">0</span>)</h2>
        <div id="jobs-list"></div>
      </div>

      <!-- Error reports -->
      <div class="diag-section">
        <h2>Rapports d'erreur (<span id="reports-count">0</span>)</h2>
        <div id="reports-list"></div>
      </div>

    </div>
  </div>

  <script src="src/controlClient.js"></script>
  <script src="logs-ui.js"></script>
</body>
</html>
