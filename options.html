<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Marketplace Helper</title><link rel="stylesheet" href="ui.css"></head>
<body data-page="options"><header class="topbar"><div class="topbar-inner"><a class="brand" href="welcome.html"><img src="icons/icon128.png" alt=""><span>Marketplace Helper<small>para Vinted</small></span></a><label class="language"><span aria-hidden="true">◎</span><select data-language data-i18n-label="uiLanguage"><option value="fr">🇫🇷 Français</option><option value="en">🇬🇧 English</option><option value="it">🇮🇹 Italiano</option><option value="es">🇪🇸 Español</option></select></label></div></header>
<nav class="nav"><a href="options.html" data-i18n="uiNavSettings"></a><a href="pending.html" data-i18n="uiNavErrors" hidden></a></nav>
<main class="container settings-page"><form id="settings-form"><p class="notice warning"><span data-i18n="uiSettingsNotice"></span></p><div class="settings-grid">
  <section class="card"><h2 data-i18n="uiItemPace"></h2><div class="fields pace-fields"><label class="field"><span data-i18n="uiDelayMinutes"></span><input name="itemDelay" type="number" min="1" max="60" step="1" inputmode="numeric" required></label><div id="cooldown-slot"></div></div></section>
  <section class="card"><h2 data-i18n="uiLimits"></h2><div class="fields"><label class="field"><span data-i18n="uiHourlyLimit"></span><input name="hourlyLimit" type="number" min="1" max="20" step="1" inputmode="numeric" required></label><label class="field"><span data-i18n="uiDailyLimit"></span><input name="dailyLimit" type="number" min="1" max="150" step="1" inputmode="numeric" required></label></div></section>
<section class="card"><h2 data-i18n="uiSafetyGuard"></h2><p class="hint" data-i18n="uiSafetyGuardText"></p><div class="fields"><label class="field"><span data-i18n="uiItemCooldownHours"></span><input name="itemCooldownHours" type="number" min="24" max="720" step="1" inputmode="numeric" required></label><label class="field"><span data-i18n="uiBreakEvery"></span><input name="breakEvery" type="number" min="2" max="20" step="1" inputmode="numeric" required></label><label class="field"><span data-i18n="uiBreakMinutes"></span><input name="breakMinutes" type="number" min="5" max="120" step="1" inputmode="numeric" required></label></div><label class="transfer-toggle"><span class="muted" id="quiet-description" data-i18n="uiQuietHours"></span><input name="quietHours" type="checkbox" role="switch" aria-labelledby="quiet-description"><span class="toggle-track" aria-hidden="true"></span></label><div class="fields"><label class="field"><span data-i18n="uiQuietStart"></span><input name="quietStart" type="number" min="0" max="23" step="1" inputmode="numeric" required></label><label class="field"><span data-i18n="uiQuietEnd"></span><input name="quietEnd" type="number" min="0" max="23" step="1" inputmode="numeric" required></label></div></section><section class="card"><label class="transfer-toggle"><span id="transfer-description" class="muted" data-i18n="uiTransferDescription"></span><input name="showTransferButton" type="checkbox" role="switch" aria-labelledby="transfer-description"><span class="toggle-track" aria-hidden="true"></span></label></section></div><p id="page-status" class="status-message" role="status"></p></form></main>
<script src="src/controlClient.js"></script><script src="src/locale.js?v=0.11.5"></script><script src="ui.js?v=0.11.5"></script></body></html>
